[workspace]
resolver = "3"
members = ["crates/xsum-core", "crates/polars-xsum"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/miraisolutions/polars-xsum"
authors = ["Martin Studer <martin.studer@mirai-solutions.com>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Document private items too: most of polars-xsum is private.
missing_docs_in_private_items = "warn"
# Bit-level float manipulation needs many deliberate integer casts.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
