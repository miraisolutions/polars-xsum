[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "polars-xsum"
description = "Exact, correctly rounded summation of floats for Polars (Radford Neal's xsum superaccumulators)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Studer", email = "martin.studer@mirai-solutions.com" }]
requires-python = ">=3.11"
dynamic = ["version"]
# From Polars 1.28, `xsum` sums all groups of `group_by`/`over` in one plugin
# call (an elementwise function of `implode()` gives one value per group). The
# full test suite passes from Polars 1.28.0 (checked in CI) up to the latest
# release.
dependencies = ["polars>=1.28"]
keywords = ["polars", "plugin", "summation", "exact", "floating-point", "xsum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://miraisolutions.github.io/polars-xsum/"
Repository = "https://github.com/miraisolutions/polars-xsum"
Issues = "https://github.com/miraisolutions/polars-xsum/issues"
Changelog = "https://github.com/miraisolutions/polars-xsum/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "test" },
    "maturin>=1.9,<2",
    "ruff>=0.11",
    "ty>=0.0.93",
]
# What the test suite needs besides the package (CI installs it next to the
# built wheels and the sdist).
test = [
    "hypothesis>=6.100",
    "numpy>=2.0",
    "pytest>=8.3",
]
# Sphinx documentation (`uv run --group docs sphinx-build ...`, see README.md).
docs = [
    "myst-parser>=4",
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8",
    "sphinx-copybutton>=0.5",
]

[tool.maturin]
manifest-path = "crates/polars-xsum/Cargo.toml"
python-source = "python"
module-name = "polars_xsum._internal"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension whenever the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
addopts = ["--doctest-modules", "--strict-markers", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # no per-file copyright headers
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "INP001"]
"benchmarks/**" = ["T201", "S311", "INP001", "PLR2004"]
# Sphinx reads its settings from module-level names such as `copyright`.
"docs/conf.py" = ["INP001", "A001"]

[tool.ruff.lint.isort]
known-first-party = ["polars_xsum"]
known-local-folder = ["oracle"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.src]
include = ["python", "tests", "benchmarks"]

[tool.ty.terminal]
# Treat warnings as errors, so `ty check` fails on any diagnostic.
error-on-warning = true
