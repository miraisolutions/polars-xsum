# Weekly update PRs for GitHub Actions, Rust crates and Python dependencies.
# New releases must be a week old before they are proposed (supply-chain safety).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Crashes on import on macOS with PolarsAllocator (pola-rs/polars#29731).
      - dependency-name: pyo3
        versions: ["0.29.3"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
