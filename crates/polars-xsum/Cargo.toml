[package]
name = "polars-xsum"
description = "Polars expression plugin for exact floating-point summation (Neal's xsum)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "polars_xsum"
crate-type = ["cdylib"]

[dependencies]
# The dtype features (here and on pyo3-polars) let the plugin receive columns of
# every dtype, so unsupported ones get a proper error instead of a panic at the
# FFI boundary.
polars = { version = "0.55.1", default-features = false, features = ["dtype-f16"] }
polars-arrow = { version = "0.55.1", default-features = false }
# Polars' configuration code, to size the thread pool exactly like Polars does.
polars-config = "0.55.1"
# `extension-module` is enabled by maturin (see pyproject.toml), so that
# `cargo test` links against libpython.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive", "dtype-decimal", "dtype-categorical", "dtype-struct", "dtype-array"] }
rayon = "1.12"
xsum-core = { path = "../xsum-core" }

[lints]
workspace = true
