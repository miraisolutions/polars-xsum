[package]
name = "xsum-core"
description = "Exact, correctly rounded summation of floating-point numbers using Radford M. Neal's superaccumulators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["float", "summation", "exact", "superaccumulator", "xsum"]
categories = ["mathematics", "algorithms"]
# Used only by the Polars plugin for now, so not published to crates.io.
publish = false

[features]
default = ["parallel"]
## Multi-threaded summation of large slices via rayon.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.12", optional = true }

[dev-dependencies]
criterion = "0.8"
num-bigint = "0.5"
num-traits = "0.2"
proptest = "1.12"
rand = "0.10"
rand_distr = "0.6"
rand_xoshiro = "0.8"

[[bench]]
name = "sum"
harness = false

[lints]
workspace = true
